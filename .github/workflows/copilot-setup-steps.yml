# Pre-installs dependencies for the GitHub Copilot cloud agent, so it can build, test, and
# lint immediately instead of discovering the toolchain by trial and error.
# The job MUST be named `copilot-setup-steps`.
name: copilot-setup-steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install qa-agent with dev + parsing extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[parsing,dev]' || python -m pip install -e '.[dev]'

      - name: Warm the test collector
        run: pytest qa_agent/tests --collect-only -q
