name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (parsing + dev extras)
        run: |
          python -m pip install --upgrade pip
          # tree-sitter wheels are platform-specific; the engine degrades gracefully without them
          python -m pip install -e '.[parsing,dev]' || python -m pip install -e '.[dev]'

      - name: Run test suite
        run: pytest qa_agent/tests

  markdown-surface:
    name: skill + agent budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check skill/agent context budgets
        run: bash scripts/hooks/check-skill-budgets.sh

      - name: Validate plugin manifests
        run: |
          python - <<'PY'
          import json, pathlib, sys
          for name in (".claude-plugin/plugin.json", ".claude-plugin/marketplace.json"):
              path = pathlib.Path(name)
              try:
                  json.loads(path.read_text())
              except Exception as exc:
                  sys.exit(f"{name}: invalid JSON — {exc}")
              print(f"{name}: ok")
          PY

  build:
    name: build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
