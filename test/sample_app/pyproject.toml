[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sample-app"
version = "0.1.0"
description = "Dummy FastAPI app for exercising QA-Skills end-to-end"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]
