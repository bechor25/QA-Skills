{% extends "_base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section aria-labelledby="login-title">
  <h1 id="login-title">Sign in</h1>
  <form id="login-form" method="post" action="/api/login" data-testid="login-form" novalidate>
    <div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email" data-testid="login-email" />
    </div>
    <div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required minlength="8" autocomplete="current-password" data-testid="login-password" />
    </div>
    <button type="submit" data-testid="login-submit">Sign in</button>
    <p role="status" aria-live="polite" id="login-status" data-testid="login-status"></p>
  </form>
</section>
<script>
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const status = document.getElementById('login-status');
    const body = {
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
    };
    status.textContent = 'Signing in…';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) {
        status.textContent = 'Invalid credentials';
        return;
      }
      const data = await res.json();
      sessionStorage.setItem('token', data.access_token);
      status.textContent = 'Signed in';
    } catch (err) {
      status.textContent = 'Network error';
    }
  });
</script>
{% endblock %}
