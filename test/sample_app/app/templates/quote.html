{% extends "_base.html" %}
{% block title %}Get a quote{% endblock %}
{% block content %}
<section aria-labelledby="quote-title">
  <h1 id="quote-title">Get a quote</h1>
  <form id="quote-form" data-testid="quote-form" novalidate>
    <div>
      <label for="price">Price</label>
      <input id="price" name="price" type="number" min="0" step="0.01" required data-testid="quote-price" />
    </div>
    <div>
      <label for="discount">Discount %</label>
      <input id="discount" name="discount" type="number" min="0" max="100" step="0.1" value="0" data-testid="quote-discount" />
    </div>
    <div>
      <label for="tax">Tax rate</label>
      <input id="tax" name="tax" type="number" min="0" max="1" step="0.01" value="0.17" data-testid="quote-tax" />
    </div>
    <button type="submit" data-testid="quote-submit">Calculate</button>
  </form>
  <output id="quote-result" data-testid="quote-result" aria-live="polite"></output>
</section>
<script>
  document.getElementById('quote-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const out = document.getElementById('quote-result');
    const body = {
      price: parseFloat(document.getElementById('price').value),
      discount_pct: parseFloat(document.getElementById('discount').value || '0'),
      tax_rate: parseFloat(document.getElementById('tax').value || '0.17'),
    };
    const res = await fetch('/api/calc/quote', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      out.textContent = 'Error: ' + res.status;
      return;
    }
    const data = await res.json();
    out.textContent = `Discounted: ${data.discounted}, Tax: ${data.tax}, Total: ${data.total}`;
  });
</script>
{% endblock %}
