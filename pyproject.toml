[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-agent"
version = "2.0.0"
description = "QA Operating System — autonomous scan, test-generation, execution, and reporting engine for Claude Code."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bechor Simhaev" }]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "rich>=13.7",
]

[project.optional-dependencies]
parsing = [
  "tree-sitter>=0.21",
  "tree-sitter-languages>=1.10",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
qa-agent = "qa_agent.cli.__main__:main"

[tool.setuptools.packages.find]
include = ["qa_agent*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["qa_agent/tests"]
addopts = "-q"
